<html lang="en">

    <meta

    />

    <meta
      name="keywords"

    />

    <meta name="author" content="Dharaneesh R" />

    <meta name="theme-color" content="#0B1120" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://dharaneesh-freelance.web.app/"
    />

    <!-- =========================
         Open Graph / Facebook
    ========================== -->

    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Dharaneesh R | Freelance React Frontend Developer"
    />

    <meta
      property="og:description"
      content="I design and build fast, responsive, modern React websites for startups, businesses, and freelance clients."
    />

    <meta
      property="og:url"
      content="https://dharaneesh-freelance.web.app/"
    />

    <meta
      property="og:site_name"
      content="Dharaneesh R Freelance"
    />

    <meta
      property="og:image"
      content="https://dharaneesh-freelance.web.app/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Dharaneesh R - Freelance React Frontend Developer"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <!-- =========================
         Twitter / X
    ========================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Dharaneesh R | Freelance React Frontend Developer"
    />

    <meta
      name="twitter:description"
      content="Freelance React Frontend Developer building responsive, modern, and user-friendly web experiences."
    />

    <meta
      name="twitter:image"
      content="https://dharaneesh-freelance.web.app/og-image.png"
    />

    <!-- =========================
         Google Fonts
    ========================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- =========================
         Theme
    ========================== -->

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");

          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";

          document.documentElement.setAttribute(
            "data-theme",
            theme
          );
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
